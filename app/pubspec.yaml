name: summon_app
description: Summon AI creature runtime client prototype
publish_to: none
version: 0.17.0+17
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  audioplayers: ^6.8.1
  camera: ^0.12.2
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  http: 1.6.0 # Preview relies on fetch redirect:error + AbortableRequest.
  material_ui: ^1.11.1
  record: ^7.2.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: SummonPreviewSC
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.extracted.otf
